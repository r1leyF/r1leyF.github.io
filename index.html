<!DOCTYPE html>
<html>
  <head>
    <title>EnigmaMachine</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="topDiv">
      <h1 class="centerHeader">The Enigma Machine</h1>
      <textarea class="textArea" id="text_area" cols="80" rows="7" placeholder="Enter text"></textarea><br>
      <button class="centerButton" onclick="encryptMessage()">Encrypt</button>
    </div>
    <hr>
    <div class="bottomDiv">
      <div class="plugDiv">
        <div class="centerDiv">
          <h2 class="plugHeader">Plugs</h2>
          <p class="plugPara" id="plug_paragraph"></p>
        </div>
        <div class="plugGrid">
          <button class="plugButton"onclick="enterPlugCode(33)">A</button>
          <button class="plugButton"onclick="enterPlugCode(34)">B</button>
          <button class="plugButton"onclick="enterPlugCode(35)">C</button>
          <button class="plugButton"onclick="enterPlugCode(36)">D</button>
          <button class="plugButton"onclick="enterPlugCode(37)">E</button>
          <button class="plugButton"onclick="enterPlugCode(38)">F</button>
          <button class="plugButton"onclick="enterPlugCode(39)">G</button>
          <button class="plugButton"onclick="enterPlugCode(40)">H</button>
          <button class="plugButton"onclick="enterPlugCode(41)">I</button>
          <button class="plugButton"onclick="enterPlugCode(42)">J</button>
          <button class="plugButton"onclick="enterPlugCode(43)">K</button>
          <button class="plugButton"onclick="enterPlugCode(44)">L</button>
          <button class="plugButton"onclick="enterPlugCode(45)">M</button>
          <button class="plugButton"onclick="enterPlugCode(46)">N</button>
          <button class="plugButton"onclick="enterPlugCode(47)">O</button>
          <button class="plugButton"onclick="enterPlugCode(48)">P</button>
          <button class="plugButton"onclick="enterPlugCode(49)">Q</button>
          <button class="plugButton"onclick="enterPlugCode(50)">R</button>
          <button class="plugButton"onclick="enterPlugCode(51)">S</button>
          <button class="plugButton"onclick="enterPlugCode(52)">T</button>
          <button class="plugButton"onclick="enterPlugCode(53)">U</button>
          <button class="plugButton"onclick="enterPlugCode(54)">V</button>
          <button class="plugButton"onclick="enterPlugCode(55)">W</button>
          <button class="plugButton"onclick="enterPlugCode(56)">X</button>
          <button class="plugButton"onclick="enterPlugCode(57)">Y</button>
          <button class="plugButton"onclick="enterPlugCode(58)">Z</button>
        </div>
      </div>

      <img class="image" src="enigma.png">

      <div class="indicatorDiv">
        <h2 class="plugHeader">Rotors</h2>
        <div class="indicatorGrid">
          <input class="indicatorButton" id="idicator1" type="text" maxlength="1">
          <input class="indicatorButton" id="idicator2" type="text" maxlength="1">
          <input class="indicatorButton" id="idicator3" type="text" maxlength="1">
        </div>
      </div>
    </div>
    <button class="centerButton" onclick="reset()">Reset</button>
  </body>
  <script src="test.js"></script>
</html>
